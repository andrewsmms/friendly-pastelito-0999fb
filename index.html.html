<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --navy: #0d1b2a;
    --navy2: #1a2e45;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5f0e8;
    --correct: #2d7a4f;
    --wrong: #9b2335;
    --correct-bg: #d4edda;
    --wrong-bg: #f8d7da;
    --text: #1a1a2e;
    --muted: #5a6a7a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
  }

  /* ---- HEADER ---- */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
    border-bottom: 2px solid var(--gold);
    padding: 28px 40px 22px;
    text-align: center;
    position: relative;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 70%);
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    color: var(--gold-light);
    letter-spacing: 1px;
  }
  .header p { color: #a0b0c0; font-size: 0.92rem; margin-top: 4px; }

  /* ---- PROGRESS ---- */
  .progress-bar-wrap {
    background: var(--navy2);
    padding: 14px 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    position: sticky; top: 0; z-index: 100;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }
  .progress-text { color: var(--gold); font-weight: 600; font-size: 0.88rem; white-space: nowrap; }

  /* ---- QUIZ CONTAINER ---- */
  .quiz-wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  /* ---- SECTION TITLE ---- */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--gold);
    border-left: 3px solid var(--gold);
    padding-left: 12px;
    margin: 36px 0 20px;
    letter-spacing: 0.5px;
  }

  /* ---- QUESTION CARD ---- */
  .q-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 18px;
    transition: border-color 0.3s;
    animation: fadeUp 0.35s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .q-card.answered { border-color: rgba(201,168,76,0.4); }

  .q-num {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    font-size: 0.78rem;
    border-radius: 99px;
    padding: 2px 10px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 1.02rem;
    font-weight: 500;
    line-height: 1.55;
    margin-bottom: 18px;
    color: #e8eaf0;
  }

  /* ---- OPTIONS ---- */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .opt-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    color: #d0dce8;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.97rem;
    text-align: left;
    transition: all 0.2s;
  }
  .opt-btn:hover:not(:disabled) {
    background: rgba(201,168,76,0.1);
    border-color: var(--gold);
    color: var(--gold-light);
  }
  .opt-btn .opt-letter {
    min-width: 28px; height: 28px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.82rem;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .opt-btn.correct {
    background: #1a3d2a;
    border-color: #2d7a4f;
    color: #b7f0c8;
  }
  .opt-btn.correct .opt-letter { background: #2d7a4f; color: #fff; }

  .opt-btn.wrong {
    background: #3d1a20;
    border-color: #9b2335;
    color: #f0b7bf;
  }
  .opt-btn.wrong .opt-letter { background: #9b2335; color: #fff; }

  .opt-btn.dimmed {
    opacity: 0.45;
  }
  .opt-btn:disabled { cursor: default; }

  /* ---- FEEDBACK ---- */
  .feedback {
    margin-top: 14px;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    display: none;
  }
  .feedback.show { display: block; animation: fadeUp 0.2s ease; }
  .feedback.correct-fb { background: rgba(45,122,79,0.2); border: 1px solid #2d7a4f; color: #7ee8a2; }
  .feedback.wrong-fb   { background: rgba(155,35,53,0.2);  border: 1px solid #9b2335;  color: #f0a0aa; }

  /* ---- TRUE/FALSE ---- */
  .tf-wrap { display: flex; gap: 12px; }
  .tf-btn {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #d0dce8;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .tf-btn:hover:not(:disabled) {
    border-color: var(--gold);
    background: rgba(201,168,76,0.12);
    color: var(--gold-light);
  }
  .tf-btn.correct { background: #1a3d2a; border-color: #2d7a4f; color: #7ee8a2; }
  .tf-btn.wrong   { background: #3d1a20; border-color: #9b2335; color: #f0a0aa; }
  .tf-btn.dimmed  { opacity: 0.4; }
  .tf-btn:disabled { cursor: default; }

  /* ---- RESULTS ---- */
  #results-panel {
    display: none;
    background: rgba(255,255,255,0.04);
    border: 2px solid var(--gold);
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    margin-top: 32px;
    animation: fadeUp 0.5s ease;
  }
  #results-panel.show { display: block; }
  .result-score {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    color: var(--gold-light);
    line-height: 1;
  }
  .result-label { color: #a0b0c0; margin-top: 6px; font-size: 1rem; }
  .result-grade {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    margin-top: 18px;
    color: var(--cream);
  }

  .restart-btn {
    margin-top: 28px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 10px;
    padding: 14px 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.5px;
  }
  .restart-btn:hover { background: var(--gold-light); }

  /* ---- SUBMIT ---- */
  .submit-wrap { text-align: center; margin-top: 40px; }
  .submit-btn {
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 12px;
    padding: 16px 52px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 20px rgba(201,168,76,0.3);
  }
  .submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); }

  /* ---- SCORE BADGE ---- */
  .score-badge {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy2);
    border: 1.5px solid var(--gold);
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 0.88rem;
    color: var(--gold);
    font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: all 0.3s;
    z-index: 200;
  }

  @media (max-width: 600px) {
    .header { padding: 20px 16px; }
    .header h1 { font-size: 1.5rem; }
    .quiz-wrap { padding: 20px 12px 80px; }
    .q-card { padding: 18px 16px; }
    .progress-bar-wrap { padding: 10px 16px; }
  }
</style>

// ---- STATE ----
let answered = 0;
let score = 0;
const total = questions.length;
const userAnswers = new Array(total).fill(null);

// ---- BUILD UI ----
function build() {
  const wrap = document.getElementById('quizWrap');
  wrap.innerHTML = '';
  let currentSection = '';
  let delay = 0;

  questions.forEach((q, qi) => {
    if (q.section && q.section !== currentSection) {
      currentSection = q.section;
      const sec = document.createElement('div');
      sec.className = 'section-title';
      sec.textContent = currentSection;
      wrap.appendChild(sec);
    }

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = Math.min(delay * 0.04, 0.5) + 's';
    delay++;

    const num = document.createElement('span');
    num.className = 'q-num';
    num.textContent = `Q ${qi + 1}`;
    card.appendChild(num);

    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = q.q;
    card.appendChild(qt);

    if (q.tf) {
      const tfWrap = document.createElement('div');
      tfWrap.className = 'tf-wrap';
      q.opts.forEach((opt, oi) => {
        const btn = document.createElement('button');
        btn.className = 'tf-btn';
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(qi, oi, btn, card, tfWrap);
        tfWrap.appendChild(btn);
      });
      card.appendChild(tfWrap);
    } else {
      const optWrap = document.createElement('div');
      optWrap.className = 'options';
      const letters = ['A', 'B', 'C', 'D'];
      q.opts.forEach((opt, oi) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[oi]}</span><span>${opt}</span>`;
        btn.onclick = () => handleAnswer(qi, oi, btn, card, optWrap);
        optWrap.appendChild(btn);
      });
      card.appendChild(optWrap);
    }

    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.id = `fb-${qi}`;
    card.appendChild(fb);

    wrap.appendChild(card);
  });

  // Submit button
  const submitWrap = document.createElement('div');
  submitWrap.className = 'submit-wrap';
  const submitBtn = document.createElement('button');
  submitBtn.className = 'submit-btn';
  submitBtn.textContent = '📊 Show Final Results';
  submitBtn.onclick = showResults;
  submitWrap.appendChild(submitBtn);
  wrap.appendChild(submitWrap);

  // Results panel
  const rp = document.createElement('div');
  rp.id = 'results-panel';
  rp.innerHTML = `
    <div class="result-score" id="finalScore">0/${total}</div>
    <div class="result-label">Questions Correct</div>
    <div class="result-grade" id="finalGrade">—</div>
    <button class="restart-btn" onclick="restart()">🔄 Restart Quiz</button>
  `;
  wrap.appendChild(rp);

  updateProgress();
}

function handleAnswer(qi, chosen, clickedBtn, card, container) {
  if (userAnswers[qi] !== null) return;

  userAnswers[qi] = chosen;
  answered++;

  const correct = questions[qi].ans;
  const isCorrect = chosen === correct;
  if (isCorrect) score++;

  const btns = container.querySelectorAll('button');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    else if (i === chosen && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  const fb = document.getElementById(`fb-${qi}`);
  fb.className = `feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'} show`;
  fb.textContent = isCorrect
    ? '✓ Correct!'
    : `✗ Wrong — Correct answer: ${questions[qi].opts[correct]}`;

  card.classList.add('answered');
  updateProgress();
  updateBadge();
}

function updateProgress() {
  const pct = total > 0 ? (answered / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${answered} / ${total}`;
}

function updateBadge() {
  document.getElementById('scoreBadge').textContent = `Score: ${score} / ${answered}`;
}

function showResults() {
  const pct = Math.round((score / total) * 100);
  let grade = '';
  if (pct >= 90) grade = '🏆 Excellent!';
  else if (pct >= 75) grade = '👍 Very Good';
  else if (pct >= 60) grade = '📚 Good — Keep Studying';
  else grade = '💪 Needs More Revision';

  document.getElementById('finalScore').textContent = `${score}/${total}`;
  document.getElementById('finalGrade').textContent = `${pct}% — ${grade}`;
  const rp = document.getElementById('results-panel');
  rp.classList.add('show');
  rp.scrollIntoView({ behavior: 'smooth' });
}

function restart() {
  answered = 0;
  score = 0;
  userAnswers.fill(null);
  document.getElementById('scoreBadge').textContent = 'Score: 0 / 0';
  build();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

build();
</script>
